name: 농사로 작목별병해충 받기
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/fetch-pests.mjs', '.github/workflows/pests-fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch
        run: node scripts/fetch-pests.mjs
        env:
          MODE: ${{ vars.PESTS_MODE || 'probe' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pests-raw data/pests 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "농사로 작목별병해충 자료 받기 (자동)"
          git push
