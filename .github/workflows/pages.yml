# main 에 푸시되면 사이트를 GitHub Pages 로 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔 둘 것.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # 농사로 자료 갱신 워크플로가 커밋한 뒤 이어서 부른다

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 다른 워크플로가 방금 올린 커밋까지 포함해 배포

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # data/crops/*.json 을 고쳤으면 번들(data/crops.json)도 새로 만든다
      - name: Build crop data bundle
        run: node scripts/build-data.mjs

      # 사이트에 필요한 파일만 모은다 (수집 원자료·스크립트는 올리지 않음)
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js icons assets _site/
          cp data/crops.json data/regions.json _site/data/
          if [ -d data/pests ]; then cp -r data/pests _site/data/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
