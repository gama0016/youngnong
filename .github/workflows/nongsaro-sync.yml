# 농사로 Open API 에서 농작업일정 원자료를 받아 data/raw/ 에 저장하고, 바뀐 것이 있으면 main 에 커밋한 뒤 사이트를 다시 배포한다.
# 필요한 것: 저장소 Settings → Secrets and variables → Actions → Repository secret "NONGSARO_API_KEY"
name: 농사로 자료 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0' # 매주 월요일 03:17 (한국 시간)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nongsaro-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 농사로 Open API 에서 받기
        id: fetch
        env:
          NONGSARO_API_KEY: ${{ secrets.NONGSARO_API_KEY }}
        run: |
          if [ -z "$NONGSARO_API_KEY" ]; then
            echo "::notice::NONGSARO_API_KEY 시크릿이 아직 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/fetch-nongsaro.mjs

      - name: 데이터 번들 다시 만들기
        if: steps.fetch.outputs.skip != 'true'
        run: node scripts/build-data.mjs

      - name: 바뀐 자료 커밋
        id: commit
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 자료 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "농사로 Open API 자료 갱신 ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
